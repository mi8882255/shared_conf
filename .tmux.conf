set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g history-limit 50000

# prefix: стандартный Ctrl-b (работает везде без переназначения клавиш)

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# disable sound and visual bell
set -g bell-action none
set -g visual-bell off

# --- copy mode (vi) + системный буфер обмена
setw -g mode-keys vi
# OSC 52: копирование работает и через ssh в локальный буфер
set -g set-clipboard on
# macOS: pbcopy, Linux: xclip
set -s copy-command 'if command -v pbcopy >/dev/null; then pbcopy; else xclip -in -selection clipboard; fi'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind C-p run 'if command -v pbpaste >/dev/null; then pbpaste; else xclip -out -selection clipboard; fi | tmux load-buffer - && tmux paste-buffer'

# --- plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# поставить tpm автоматически, если его нет
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
